<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0e1b2f"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12284b"/>
      <stop offset="1" stop-color="#102039"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020711" flood-opacity=".38"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#79b8ff"/>
    </marker>
    <style>
      .sans { font-family: "PingFang SC", "Noto Sans CJK SC", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
      .title { font-size: 48px; font-weight: 800; fill: #f0f6fc; letter-spacing: -1px; }
      .subtitle { font-size: 21px; fill: #9fb3cc; letter-spacing: 2px; }
      .eyebrow { font-size: 14px; font-weight: 700; fill: #79b8ff; letter-spacing: 2px; }
      .card-title { font-size: 24px; font-weight: 750; fill: #f0f6fc; }
      .card-sub { font-size: 15px; fill: #9fb3cc; }
      .body { font-size: 16px; fill: #d0deef; }
      .small { font-size: 14px; fill: #9fb3cc; }
      .chip { font-size: 14px; font-weight: 650; fill: #d9eaff; }
      .stage { fill: #0c192d; stroke: #25415f; stroke-width: 1.5; }
      .inner { fill: #0f223c; stroke: #2b5a86; stroke-width: 1.25; }
      .green { stroke: #2f8f68; }
      .violet { stroke: #7359c7; }
      .orange { stroke: #c9833a; }
      .teal { stroke: #2d9d9c; }
      .muted-line { stroke: #263e5a; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
  <circle cx="1420" cy="80" r="260" fill="#1d4d85" opacity=".12"/>
  <circle cx="90" cy="920" r="300" fill="#1d7b67" opacity=".08"/>

  <g class="sans">
    <text x="92" y="82" class="eyebrow">CNEQUITY  /  OPEN FINANCIAL DATA INFRASTRUCTURE</text>
    <text x="92" y="142" class="title">CNEquity 架构总览</text>
    <text x="92" y="180" class="subtitle">面向中国市场 · 从 A 股开始 · 可验证 · 可复查 · 可扩展</text>
    <rect x="1235" y="92" width="205" height="62" rx="14" fill="#102641" stroke="#2e5d8b"/>
    <text x="1260" y="119" class="small">OPEN SOURCE</text>
    <text x="1260" y="141" class="chip">Apache-2.0 · cnequity</text>

    <!-- Sources -->
    <rect x="74" y="238" width="248" height="526" rx="20" class="stage" filter="url(#shadow)"/>
    <text x="102" y="278" class="eyebrow">01  SOURCES</text>
    <text x="102" y="314" class="card-title">多源数据</text>
    <text x="102" y="341" class="card-sub">公开市场与官方信息</text>
    <g class="inner">
      <rect x="98" y="374" width="200" height="58" rx="12"/>
      <rect x="98" y="444" width="200" height="58" rx="12"/>
      <rect x="98" y="514" width="200" height="58" rx="12"/>
      <rect x="98" y="584" width="200" height="58" rx="12"/>
      <rect x="98" y="654" width="200" height="58" rx="12"/>
    </g>
    <text x="122" y="399" class="card-title" font-size="19">TDX</text><text x="122" y="420" class="small">行情 · 证券主数据</text>
    <text x="122" y="469" class="card-title" font-size="19">EastMoney</text><text x="122" y="490" class="small">公告 · 财务 · 资金流</text>
    <text x="122" y="539" class="card-title" font-size="19">Sina</text><text x="122" y="560" class="small">新闻 · 复权因子</text>
    <text x="122" y="609" class="card-title" font-size="19">CNInfo / PBoC</text><text x="122" y="630" class="small">公告 · 宏观 · 权威数据</text>
    <text x="122" y="679" class="card-title" font-size="17">THS · Baostock · …</text><text x="122" y="700" class="small">行业 · 估值 · 备源</text>

    <!-- Ingest -->
    <rect x="362" y="238" width="300" height="526" rx="20" class="stage green" filter="url(#shadow)"/>
    <text x="390" y="278" class="eyebrow">02  INGEST &amp; ORCHESTRATION</text>
    <text x="390" y="314" class="card-title">采集与编排</text>
    <text x="390" y="341" class="card-sub">统一入口：CLI + 可恢复批次</text>
    <g class="inner green">
      <rect x="386" y="374" width="252" height="76" rx="12"/>
      <rect x="386" y="466" width="252" height="76" rx="12"/>
      <rect x="386" y="558" width="252" height="76" rx="12"/>
      <rect x="386" y="650" width="252" height="76" rx="12"/>
    </g>
    <text x="410" y="403" class="card-title" font-size="19">Adapters</text><text x="410" y="428" class="small">HTTP · WebSocket · 文件 · 备源路由</text>
    <text x="410" y="495" class="card-title" font-size="19">DAG / Manifest</text><text x="410" y="520" class="small">依赖管理 · 批次 · 版本控制</text>
    <text x="410" y="587" class="card-title" font-size="19">Retry / Failover</text><text x="410" y="612" class="small">按批重试 · 失败可定位 · 源健康</text>
    <text x="410" y="679" class="card-title" font-size="17">cne init · run · backfill</text><text x="410" y="704" class="small">一次采集 · 持续日更 · 可中断续跑</text>

    <!-- Lake -->
    <rect x="702" y="238" width="410" height="526" rx="20" class="stage violet" filter="url(#shadow)"/>
    <text x="732" y="278" class="eyebrow">03  DATA LAYER</text>
    <text x="732" y="314" class="card-title">本地 Parquet 数据层</text>
    <text x="732" y="341" class="card-sub">开放格式 · 统一列契约 · 可追溯</text>
    <g class="inner violet">
      <rect x="730" y="374" width="354" height="88" rx="12"/>
      <rect x="730" y="480" width="354" height="88" rx="12"/>
      <rect x="730" y="586" width="354" height="88" rx="12"/>
    </g>
    <text x="758" y="409" class="card-title" font-size="20">staging</text><text x="758" y="436" class="small">原始批次 · 来源快照 · 可重放</text>
    <text x="758" y="515" class="card-title" font-size="20">curated</text><text x="758" y="542" class="small">稳定 schema · 主键 · provenance</text>
    <text x="758" y="621" class="card-title" font-size="20">derived</text><text x="758" y="648" class="small">复权因子 · 行业指数 · 市场宽度</text>
    <rect x="730" y="700" width="354" height="42" rx="10" fill="#101d33" stroke="#654eb1"/>
    <text x="758" y="727" class="chip">source · data_version · fetched_at · meta/</text>

    <!-- Contract -->
    <rect x="1152" y="238" width="310" height="526" rx="20" class="stage teal" filter="url(#shadow)"/>
    <text x="1182" y="278" class="eyebrow">04  RESEARCH CONTRACT</text>
    <text x="1182" y="314" class="card-title">研究与服务</text>
    <text x="1182" y="341" class="card-sub">同一份数据，多种消费方式</text>
    <g class="inner teal">
      <rect x="1180" y="374" width="254" height="80" rx="12"/>
      <rect x="1180" y="468" width="254" height="80" rx="12"/>
      <rect x="1180" y="562" width="254" height="80" rx="12"/>
      <rect x="1180" y="656" width="254" height="80" rx="12"/>
    </g>
    <text x="1206" y="408" class="card-title" font-size="19">Python load()</text><text x="1206" y="433" class="small">adjust · universe · PIT</text>
    <text x="1206" y="502" class="card-title" font-size="19">DuckDB · Polars</text><text x="1206" y="527" class="small">本地 SQL · 高性能分析</text>
    <text x="1206" y="596" class="card-title" font-size="19">cne serve</text><text x="1206" y="621" class="small">只读控制台 · 质量 · 覆盖</text>
    <text x="1206" y="690" class="card-title" font-size="19">cne mcp</text><text x="1206" y="715" class="small">AI agent · 可解释查询</text>

    <!-- Arrows -->
    <path d="M 322 500 H 354" stroke="#79b8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 662 500 H 694" stroke="#79b8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 1112 500 H 1144" stroke="#79b8ff" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="331" y="480" class="small">fetch</text>
    <text x="671" y="480" class="small">compact</text>
    <text x="1120" y="480" class="small">query</text>

    <!-- Quality bar -->
    <rect x="74" y="818" width="1388" height="124" rx="20" fill="#0c192d" stroke="#355879" filter="url(#shadow)"/>
    <text x="104" y="855" class="eyebrow">CROSS-CUTTING GUARANTEES</text>
    <text x="104" y="895" class="body">行级溯源</text><text x="104" y="920" class="small">每行可追到来源与批次</text>
    <text x="350" y="895" class="body">历史股票池</text><text x="350" y="920" class="small">退市股与历史成分</text>
    <text x="604" y="895" class="body">PIT fundamentals</text><text x="604" y="920" class="small">避免未来函数</text>
    <text x="872" y="895" class="body">质量审计</text><text x="872" y="920" class="small">跨源校验 · fail loud</text>
    <text x="1124" y="895" class="body">可扩展</text><text x="1124" y="920" class="small">新增数据源与数据集</text>

    <text x="92" y="984" class="small">CNEquity turns fragmented China-market data into a reproducible local foundation for research and AI.</text>
    <text x="1440" y="984" class="mono small" text-anchor="end">cnequity · cne</text>
  </g>
</svg>
