; ─────────────────────────────────────────────
; supervisord.conf — 单容器管理 4 个进程
; 1. quant-api          FastAPI 主服务 :17891
; 2. quant-data-status  数据状态看板 :8001
; 3. quant-cne          CNEquity 数据湖看板 :8787
; 4. quant-cron         supercronic 定时任务调度器
;
; 说明：supervisor 的 environment= 会整体覆盖子进程环境变量，
; 因此需要透传的容器环境变量用 %(ENV_XXX)s 显式展开。
; ─────────────────────────────────────────────

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[program:quant-api]
command=python -m uvicorn backend.main:app --host 0.0.0.0 --port 17891
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/quant-api.log
stderr_logfile=/var/log/supervisor/quant-api.err
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
environment=PYTHONPATH="/app",QUANT_UI_PYTHON="%(ENV_QUANT_UI_PYTHON)s",QUANT_UI_DATA_DIR="%(ENV_QUANT_UI_DATA_DIR)s",QUANT_DATA_SOURCE="%(ENV_QUANT_DATA_SOURCE)s",QUANT_USE_CNE="%(ENV_QUANT_USE_CNE)s"

[program:quant-data-status]
command=python -m uvicorn data_status.app:app --host 0.0.0.0 --port 8001
directory=/app
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/quant-data-status.log
stderr_logfile=/var/log/supervisor/quant-data-status.err
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
environment=PYTHONPATH="/app",QUANT_UI_PYTHON="%(ENV_QUANT_UI_PYTHON)s",QUANT_UI_DATA_DIR="%(ENV_QUANT_UI_DATA_DIR)s",QUANT_DATA_STATUS_DIR="%(ENV_QUANT_DATA_STATUS_DIR)s"

[program:quant-cne]
; CNEquity 数据湖看板（只读）。必须在 CNEquity/ 目录下启动，
; 因为 config 中的相对路径（data.root、external_*_root）按 CWD 解析。
; 非 loopback 绑定必须提供 token（CNE_TOKEN），否则启动即拒绝。
command=cne serve --config configs/cnequity.quant_dataset.toml --host 0.0.0.0 --port 8787 --token %(ENV_CNE_TOKEN)s
directory=/app/CNEquity
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/quant-cne.log
stderr_logfile=/var/log/supervisor/quant-cne.err
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=PYTHONPATH="/app"

[program:quant-cron]
command=supercronic /app/docker/crontab
directory=/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/quant-cron.log
stderr_logfile=/var/log/supervisor/quant-cron.err
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
environment=PYTHONPATH="/app",QUANT_UI_PYTHON="%(ENV_QUANT_UI_PYTHON)s",QUANT_UI_DATA_DIR="%(ENV_QUANT_UI_DATA_DIR)s",QUANT_DATA_SOURCE="%(ENV_QUANT_DATA_SOURCE)s",QUANT_USE_CNE="%(ENV_QUANT_USE_CNE)s"

; ─────────────────────────────────────────────
; 容器退出时优雅停止所有子进程
; ─────────────────────────────────────────────
[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface